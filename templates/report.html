{% extends 'base_profile.html' %}
{% load static %}

{% block extra_css %}
<style>
    .filter-card {
        background: #fff;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        margin: 30px 0;
        border: 1px solid #e0e0e0;
    }
    .table-container {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        margin-top: 20px;
    }
    .attendance-table thead {
        background: linear-gradient(135deg, #28a745, #20c997);
        color: white;
    }
    .badge-in  { background-color: #0d6efd !important; color: white; }
    .badge-out { background-color: #dc3545 !important; color: white; }
</style>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
{% endblock %}

{% block content %}
<h2 class="text-center my-5 text-primary fw-bold">گزارش حضور و غیاب</h2>

<div class="filter-card">
    <form id="filterForm"
          hx-get="{% url 'attendance-report' %}"
          hx-target="#reportResults"
          hx-swap="innerHTML"
          hx-trigger="change from:#filterForm delay:400ms, submit"
          hx-push-url="true">

        <div class="row g-3 align-items-end">
            <!-- فیلتر کاربر -->
            <div class="col-md-3">
                <label class="form-label fw-bold">کاربر</label>
                <select name="user" class="form-select form-select-sm">
                    <option value="">همه کاربران</option>
                    {% for u in users %}
                        <option value="{{ u.nationality_number }}"
                            {% if filter_values.user == u.nationality_number %}selected{% endif %}>
                            {{ u.first_name }} {{ u.last_name }}
                            {% if u.nationality_number %}({{ u.nationality_number }}){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- فیلتر وضعیت -->
            <div class="col-md-2">
                <label class="form-label fw-bold">وضعیت</label>
                <select name="status" class="form-select form-select-sm">
                    <option value="">همه</option>
                    <option value="complete"   {% if filter_values.status == "complete" %}selected{% endif %}>کامل</option>
                    <option value="incomplete" {% if filter_values.status == "incomplete" %}selected{% endif %}>ناقص</option>
                </select>
            </div>

            <!-- فیلتر بازه تاریخ -->
            <div class="col-md-2">
                <label class="form-label fw-bold">از تاریخ</label>
                <input type="date" name="start_date" class="form-control form-control-sm" value="{{ filter_values.start_date }}">
            </div>

            <div class="col-md-2">
                <label class="form-label fw-bold">تا تاریخ</label>
                <input type="date" name="end_date" class="form-control form-control-sm" value="{{ filter_values.end_date }}">
            </div>

            <!-- دکمه‌ها -->
            <div class="col-md-3 d-flex flex-column gap-2">
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-success flex-fill" onclick="exportReport('csv')">
                        <i class="bi bi-file-earmark-spreadsheet"></i> CSV
                    </button>
                    <button type="button" class="btn btn-info text-white flex-fill" onclick="exportReport('xlsx')">
                        <i class="bi bi-file-earmark-excel"></i> Excel
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

<div id="reportResults" class="table-container mt-3">
    {% include "attendance_report_table.html" %}
</div>

<script>
function exportReport(type) {
    const form = document.getElementById('filterForm');
    const params = new URLSearchParams(new FormData(form));
    params.set('export', type);
    params.delete('page');
    window.location.href = "{% url 'attendance-report' %}?" + params.toString();
}
</script>
{% endblock %}
