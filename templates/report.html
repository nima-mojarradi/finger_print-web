{% extends 'base_admin_page.html' %}
{% load static widget_tweaks %}

{% block page_title %}گزارش حضور و غیاب{% endblock %}

{% block admin_content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">گزارش جامع تردد کاربران</h2>
    
    <div>
        <a href="?export=csv{{ request.GET.urlencode|slice:":0" }}{% if request.GET %}&{{ request.GET.urlencode }}{% endif %}" 
           class="btn btn-success btn-sm me-2">
            دانلود CSV
        </a>
        <a href="?export=xlsx{{ request.GET.urlencode|slice:":0" }}{% if request.GET %}&{{ request.GET.urlencode }}{% endif %}" 
           class="btn btn-danger btn-sm">
            دانلود Excel
        </a>
    </div>
</div>

<!-- فیلترها -->
<div class="card shadow-sm mb-4">
    <div class="card-body p-4">
        <h5 class="mb-4 text-dark fw-bold">فیلتر گزارش</h5>
        <form id="filterForm" hx-get="{% url 'attendance-report' %}" hx-target="#reportResults" hx-swap="innerHTML" hx-indicator="#loading">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold">کاربر</label>
                    <select name="user" class="form-select">
                        <option value="">همه کاربران</option>
                        {% for u in users %}
                        <option value="{{ u.nationality_number }}" {% if request.GET.user == u.nationality_number %}selected{% endif %}>
                            {{ u.first_name }} {{ u.last_name }} - {{ u.nationality_number }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">نوع تردد</label>
                    <select name="event_type" class="form-select">
                        <option value="">همه</option>
                        <option value="in" {% if request.GET.event_type == 'in' %}selected{% endif %}>ورود</option>
                        <option value="out" {% if request.GET.event_type == 'out' %}selected{% endif %}>خروج</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">از تاریخ</label>
                    <input type="date" name="start_date" class="form-control" value="{{ request.GET.start_date }}">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">تا تاریخ</label>
                    <input type="date" name="end_date" class="form-control" value="{{ request.GET.end_date }}">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <span id="loading" class="spinner-border spinner-border-sm me-2" style="display:none"></span>
                        اعمال فیلتر
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- جدول نتایج -->
<div id="reportResults">
    {% include "attendance_report_table.html" %}
</div>

{% endblock %}
