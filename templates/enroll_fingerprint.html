{% extends "base_profile.html" %}
{% load static %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; text-align: center; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); background-color: #f9f9f9;">
    <h2 style="margin-bottom: 30px;">ثبت اثرانگشت برای {{ user.first_name }} {{ user.last_name }}</h2>
    
    <p style="font-size: 18px; margin-bottom: 20px;">لطفاً انگشت خود را روی دستگاه قرار دهید</p>
    
    <div id="statusMessage" style="font-size: 16px; color: #555; margin-bottom: 20px;">در انتظار اسکن اثرانگشت...</div>

    <div id="successMessage" style="font-size: 16px; color: green;"></div>
    <div id="errorMessage" style="font-size: 16px; color: red;"></div>
</div>

<script>
function checkFingerprintStatus() {
    // اینجا endpoint بکند که دستگاه به آن داده ارسال می‌کند
    fetch("{% url 'fingerprint-attendance' %}?user={{ user.nationality_number }}")
        .then(response => response.json())
        .then(data => {
            if(data.status === "success"){
                document.getElementById('statusMessage').innerText = "اثر انگشت با موفقیت ثبت شد!";
                document.getElementById('successMessage').innerText = `ورود/خروج شما ثبت شد: ${data.event_type} در ساعت ${data.timestamp}`;
                document.getElementById('errorMessage').innerText = "";
            } else if(data.status === "waiting"){
                // هنوز اثرانگشت ثبت نشده، دوباره بررسی کن
                setTimeout(checkFingerprintStatus, 2000);
            } else {
                document.getElementById('errorMessage').innerText = "خطا در ثبت اثرانگشت: " + data.message;
            }
        })
        .catch(err => {
            document.getElementById('errorMessage').innerText = "خطای شبکه: " + err;
            setTimeout(checkFingerprintStatus, 5000);
        });
}

checkFingerprintStatus();
</script>
{% endblock %}
