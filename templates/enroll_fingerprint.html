{% extends "base_admin_page.html" %}
{% load static %}

{% block admin_content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h4>ثبت اثرانگشت کاربر</h4>
                </div>
                <div class="card-body text-center p-5">
                    <h5>کاربر: {{ user.first_name }} {{ user.last_name }}</h5>
                    <p class="lead mt-4">
                        لطفاً انگشت <strong class="text-primary">{{ finger_display }}</strong> را روی دستگاه قرار دهید.
                    </p>

                    <div id="status" class="mt-4 fs-4"></div>

                    <button id="startEnroll" class="btn btn-success btn-lg mt-4 px-5">
                        شروع ثبت اثرانگشت
                    </button>

                    <div class="mt-4">
                        <a href="{% url 'user-list' %}" class="btn btn-outline-secondary">بعداً ثبت کنم</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let enrolling = false;

document.getElementById('startEnroll').addEventListener('click', function() {
    if (enrolling) return;
    enrolling = true;
    document.getElementById('status').innerHTML = '<span class="text-info">در حال انتظار برای اسکن انگشت...</span>';

    // این بخش باید با SDK دستگاه شما هماهنگ بشه
    // فرض: دستگاه یک endpoint داره که وقتی انگشت اسکن شد، template رو برمی‌گردونه
    // اینجا یک مثال ساده با polling فرض می‌کنیم

    function checkDevice() {
        fetch('/api/get-fingerprint-template/')  // ← این رو باید خودت پیاده کنی (یا از JS SDK دستگاه)
            .then(res => res.json())
            .then(data => {
                if (data.template_data) {
                    sendToServer(data.template_data);
                } else if (data.waiting) {
                    setTimeout(checkDevice, 2000);
                } else {
                    document.getElementById('status').innerHTML = '<span class="text-danger">خطا: ' + (data.error || 'اسکن ناموفق') + '</span>';
                    enrolling = false;
                }
            })
            .catch(() => {
                document.getElementById('status').innerHTML = '<span class="text-danger">خطا در ارتباط با دستگاه</span>';
                enrolling = false;
            });
    }

    function sendToServer(template_data) {
        fetch("{% url 'add_fingerprint' user.nationality_number %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                finger_name: "{{ selected_finger }}",
                template_data: template_data
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                document.getElementById('status').innerHTML = '<span class="text-danger">' + data.error + '</span>';
                enrolling = false;
            } else {
                document.getElementById('status').innerHTML = '<span class="text-success">✓ اثرانگشت با موفقیت ثبت شد!</span>';
                setTimeout(() => {
                    window.location.href = "{% url 'show_temp_password' user.nationality_number %}";
                }, 2000);
            }
        });
    }

    checkDevice();
});
</script>
{% endblock %}
