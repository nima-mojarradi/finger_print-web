{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}پنل مدیریت{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link
      href="https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css"
      rel="stylesheet"
    />

    <style>
      /* Global Styles for Senior Front-End Aesthetic */
      body {
        font-family: 'Vazir', sans-serif;
        background-color: #f7f9fc;
        color: #333;
      }
      a {
        text-decoration: none;
      }
      /* Ensure Django messages are styled well */
      .alert {
        border-radius: 0.75rem;
      }
      .card {
        border-radius: 1rem;
        border: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Soft, consistent shadow */
      }
      .card-header {
        border-top-left-radius: 1rem;
        border-top-right-radius: 1rem;
        padding: 1.5rem;
      }
    </style>

    {% block extra_css %}{% endblock %}
  </head>
  <body>

    <!-- {% block profile_content %}{% endblock %} -->
    <!-- {% block content_profile %}{% endblock %} -->
    {% block content %}{% endblock %}


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/base.js' %}"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
