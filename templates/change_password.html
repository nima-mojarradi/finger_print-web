

{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تغییر رمز عبور</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-shield-lock me-2"></i>
                        تغییر رمز عبور
                    </h4>
                </div>
                <div class="card-body p-5">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show mb-4">
                                <i class="bi {% if message.tags == 'error' %}bi-exclamation-triangle{% else %}bi-check-circle{% endif %} me-2"></i>
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" novalidate>
                        {% csrf_token %}

                        <!-- رمز فعلی -->
                        <div class="mb-4 position-relative">
                            <label class="form-label fw-semibold">رمز عبور فعلی</label>
                            <div class="input-group">
                                <input type="password" name="old_password" class="form-control form-control-lg" required id="id_old_password">
                                <span class="input-group-text password-toggle" onclick="togglePassword('id_old_password', this)">
                                    <i class="bi bi-eye-slash" id="icon_old_password"></i>
                                </span>
                            </div>
                        </div>

                        <!-- رمز جدید -->
                        <div class="mb-4 position-relative">
                            <label class="form-label fw-semibold">رمز عبور جدید</label>
                            <div class="input-group">
                                <input type="password" name="new_password1" class="form-control form-control-lg" required minlength="8" id="id_new_password1">
                                <span class="input-group-text password-toggle" onclick="togglePassword('id_new_password1', this)">
                                    <i class="bi bi-eye-slash" id="icon_new_password1"></i>
                                </span>
                            </div>
                            <small class="text-muted">حداقل ۸ کاراکتر</small>
                        </div>

                        <!-- تکرار رمز جدید -->
                        <div class="mb-4 position-relative">
                            <label class="form-label fw-semibold">تکرار رمز عبور جدید</label>
                            <div class="input-group">
                                <input type="password" name="new_password2" class="form-control form-control-lg" required id="id_new_password2">
                                <span class="input-group-text password-toggle" onclick="togglePassword('id_new_password2', this)">
                                    <i class="bi bi-eye-slash" id="icon_new_password2"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-grid gap-3 mt-5">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                <i class="bi bi-check-lg me-2"></i>
                                تغییر رمز عبور
                            </button>
                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-arrow-right me-2"></i>
                                بازگشت به پروفایل
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(inputId, iconElement) {
    const input = document.getElementById(inputId);
    const icon = iconElement.querySelector('i');
    
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    } else {
        input.type = "password";
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    }
}
</script>
</body>
</html>
